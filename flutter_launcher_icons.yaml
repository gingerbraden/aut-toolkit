flutter_launcher_icons:
  android: true
  ios: true
  image_path: "res/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "res/background.png"
  adaptive_icon_foreground: "res/icon-foreground.png"
  web:
    generate: true
    image_path: "res/icon.png"
  windows:
    generate: true
    image_path: "res/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "res/icon.png"